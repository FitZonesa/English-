<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لِسان — تعلّم الإنجليزية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EA;--panel:#FFF;--panel2:#FAF8F1;--panel3:#EFECE2;--ink:#22322B;--ink2:#5A6A61;--ink3:#96A296;--line:rgba(34,50,43,.13);--line2:rgba(34,50,43,.07);--jade:#0E7A5C;--jade-ink:#0A5B44;--jade-soft:#E2EFE8;--jade-line:#BED8CB;--amber:#C98A18;--amber-soft:#F7EDD6;--red:#C04A38;--red-soft:#F8E7E2;--red-line:#E4C3BB;--f-ui:'IBM Plex Sans Arabic',system-ui,sans-serif;--f-en:'Sora',sans-serif}
[data-theme=dark]{--bg:#0F1713;--panel:#18231D;--panel2:#1C2A22;--panel3:#24332B;--ink:#E9EFE8;--ink2:#A8B5AA;--ink3:#727F74;--line:rgba(233,239,232,.14);--line2:rgba(233,239,232,.07);--jade:#43BE92;--jade-ink:#8BDDBD;--jade-soft:rgba(67,190,146,.13);--jade-line:rgba(67,190,146,.35);--amber:#E2A63D;--amber-soft:rgba(226,166,61,.14);--red:#E07158;--red-soft:rgba(224,113,88,.13);--red-line:rgba(224,113,88,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;overflow:hidden;height:100vh;height:100dvh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
.en{font-family:var(--f-en);direction:ltr;display:inline-block}
.num{font-family:var(--f-en);direction:ltr;display:inline-block}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
@keyframes lispin{to{transform:rotate(360deg)}}
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:64px 1fr;height:100vh;height:100dvh}
#root.f{height:100vh;height:100dvh;overflow-y:auto}
#sidebar{grid-row:1/3;display:flex;flex-direction:column;border-inline-end:1px solid var(--line);background:var(--panel);padding:0 14px;overflow:hidden}
#brandrow{height:64px;display:flex;align-items:center;gap:10px;flex:none}
.logomark{width:34px;height:34px;border-radius:9px;background:var(--jade);display:grid;place-items:center;flex:none}
.brandname{font-weight:700;font-size:17px}.brandname small{display:block;font-size:9px;color:var(--ink3)}
#nav{margin-top:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500;position:relative;text-align:start;width:100%}
.navitem svg{flex:none}
.navitem:hover{background:var(--panel2);color:var(--ink)}
.navitem.on{background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.navitem.on::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--jade)}
.navsec{font-size:11px;color:var(--ink3);font-weight:600;padding:14px 12px 5px}
#userchip{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);width:100%;margin-top:10px;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--jade-soft);color:var(--jade-ink);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-en)}
#topbar{display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#crumbtitle{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tspacer{flex:1}
#searchbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:230px;color:var(--ink3)}
#searchbox input{background:none;border:0;outline:0;flex:1;color:var(--ink);font-size:13px;min-width:0}
.pill{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:600;font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);position:relative;flex:none}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
#main{overflow-y:auto;padding:24px 24px 60px}
.wrap{max-width:1000px;margin:0 auto}
#bottomnav{display:none}
@media(max-width:940px){#app{grid-template-columns:1fr;grid-template-rows:64px 1fr}#sidebar{display:none}#searchbox{display:none}#main{padding:14px 14px 90px}#bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--panel);border-top:1px solid var(--line);z-index:40}.bnitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--ink3);font-weight:600}.bnitem.on{color:var(--jade-ink)}}
@media(max-width:560px){#topbar{gap:7px;padding:0 10px}.pill.g2{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 10px 28px -16px rgba(34,50,43,.2)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--jade-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:10px 18px;font-weight:700;font-size:14px;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--jade);color:#fff}
[data-theme=dark] .btn.pri{color:#0C211A}
.btn.sec{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.btn.ghost{color:var(--ink2)}
.btn.warn{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 24px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel3);color:var(--ink2)}
.tag.j{background:var(--jade-soft);color:var(--jade-ink)}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.r{background:var(--red-soft);color:var(--red)}
.input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:0}
.input:focus{border-color:var(--jade)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:13px 0 5px}
.divider{height:1px;background:var(--line2);margin:14px 0}
.progress{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);border-radius:99px}
.progress.a i{background:var(--amber)}
.abtn{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;background:var(--jade-soft);color:var(--jade-ink);flex:none}
.abtn:hover{background:var(--jade);color:#fff}
[data-theme=dark] .abtn:hover{color:#0C211A}
.abtn.big{width:48px;height:48px;border-radius:13px}
.abtn.slow{background:var(--panel2);color:var(--ink2);width:28px;height:28px}
.headrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.headrow h1{font-size:20px;font-weight:700;flex:1;min-width:150px}
.backlink{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-weight:600;font-size:13px;padding:5px 9px;border-radius:8px}
.backlink:hover{background:var(--panel2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.dash,.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:12px}
.stat .v{font-family:var(--f-en);font-size:22px;font-weight:800}
.stat .k{font-size:12px;color:var(--ink3)}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pop{animation:pp .25s}
@keyframes pp{from{transform:scale(.97);opacity:0}}
.node{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:10px;width:100%;text-align:start}
.node:hover{background:var(--panel2)}
.node .nd{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink2)}
.node.done .nd{background:var(--jade);border-color:var(--jade);color:#fff}
[data-theme=dark] .node.done .nd{color:#0C211A}
.node.cur .nd{border-color:var(--jade);color:var(--jade-ink);background:var(--jade-soft)}
.node.lock{opacity:.5}
.node .nt{flex:1;min-width:0}.node .nt b{display:block;font-size:14px}
.node .nt small{color:var(--ink3);font-size:12px}
.unithead{display:flex;align-items:center;gap:10px;margin:16px 0 5px;font-weight:700;color:var(--ink2)}
.unitline{height:2px;flex:1;background:var(--line)}
.lvlbadge{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-en);font-weight:800;flex:none;border:2px solid var(--jade-line);background:var(--jade-soft);color:var(--jade-ink)}
.lvlbadge.lock{border-color:var(--line);background:var(--panel2);color:var(--ink3)}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:100;display:flex;flex-direction:column}
#player .phead{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#psegs{flex:1;display:flex;gap:3px;max-width:420px}
#psegs i{flex:1;height:5px;border-radius:5px;background:var(--panel3)}
#psegs i.d{background:var(--jade)}#psegs i.x{background:var(--red)}
#pbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:26px 16px 40px}
.pcard{width:100%;max-width:640px}
.qtext{font-size:19px;font-weight:700;margin-bottom:7px;line-height:1.5}
.qsub{color:var(--ink2);font-size:14px;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;margin-bottom:9px;background:var(--panel);font-size:16px}
.opt:hover{border-color:var(--jade-line)}
.opt .ob{width:25px;height:25px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-en);font-size:12px;font-weight:700;flex:none;color:var(--ink3)}
.opt.sel{border-color:var(--jade);background:var(--jade-soft)}
.opt.ok{border-color:var(--jade);background:var(--jade-soft)}
.opt.ok .ob{background:var(--jade);color:#fff;border-color:var(--jade)}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.35;text-decoration:line-through}
.wordinput{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:13px;padding:14px 16px;font-size:17px;outline:0;font-family:var(--f-en);direction:ltr;text-align:center}
.wordinput:focus{border-color:var(--jade)}
.chipline{min-height:56px;border:1.5px dashed var(--line);border-radius:13px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.wchip{padding:6px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-en);cursor:pointer}
.wchip:hover{border-color:var(--jade-line)}
.fb{border-radius:13px;padding:14px 16px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--jade-soft);border:1px solid var(--jade-line)}
.fb.no{background:var(--red-soft);border:1px solid var(--red-line)}
.fb b{display:block;font-size:14px}.fb small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.mitem{padding:12px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);font-size:15px;min-height:44px}
.mitem.sel{border-color:var(--jade);background:var(--jade-soft)}
.mitem.lock{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade-ink);pointer-events:none}
.mitem.bad{border-color:var(--red);background:var(--red-soft)}
.speaker{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.dline{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel)}
.dline.hl{border-color:var(--jade);background:var(--jade-soft)}
.spk{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none;font-family:var(--f-en)}
.spk.s0{background:var(--jade-soft);color:var(--jade-ink)}.spk.s1{background:var(--amber-soft);color:var(--amber)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
#sheetback{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,25,20,.5);z-index:200;display:none}
#sheetback.show{display:block}
#sheet{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 18px 24px;z-index:201;transform:translateY(100%);transition:.3s}
#sheetback.show + #sheet{transform:translateY(0)}
.notifrow{display:flex;gap:10px;padding:10px;border-radius:10px;width:100%;text-align:start;align-items:center}
.notifrow:hover{background:var(--panel2)}
.flame{color:var(--amber)}
.xpflash{position:fixed;top:78px;right:40px;font-family:var(--f-en);font-weight:800;color:var(--amber);font-size:19px;z-index:150;pointer-events:none;animation:xpf 1.1s forwards}
@keyframes xpf{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.tabs{display:flex;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.tab.on{background:var(--panel);color:var(--jade-ink)}
.vocabrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2);cursor:pointer}
.vocabrow:hover{background:var(--panel2)}
.vw{font-family:var(--f-en);font-weight:700;font-size:16px;min-width:100px;direction:ltr}
.vocabopen{background:var(--panel2);border-bottom:1px solid var(--line2);padding:13px 16px}
.mission{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2)}
.mission:last-child{border-bottom:0}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:110px;justify-content:flex-end}
.bcol .b{width:100%;max-width:32px;background:var(--jade-soft);border:1px solid var(--jade-line);border-radius:6px 6px 3px 3px}
.bcol.today .b{background:var(--jade)}
.bcol .bl{font-size:10px;color:var(--ink3)}
.achrow{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px}
.ach{flex:none;width:92px;text-align:center}
.ach .am{width:54px;height:54px;margin:0 auto 6px;border-radius:15px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber)}
.ach.lock{opacity:.4}
.ach b{font-size:11px;display:block;font-weight:600}
.gitem{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line2);width:100%;text-align:start}
.gitem:hover{background:var(--panel2)}
.exrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:var(--panel2)}
.exrow .en{font-weight:600}.exrow .ar{color:var(--ink2);font-size:13px;flex:1}
.mistrow{padding:11px 13px;border:1px solid var(--red-line);background:var(--red-soft);border-radius:11px;margin-bottom:7px}
.mistrow .w{color:var(--red);text-decoration:line-through;font-weight:600}
.mistrow .r{color:var(--jade-ink);font-weight:700}
.formula{font-family:var(--f-en);direction:ltr;text-align:center;background:var(--panel2);border:1px dashed var(--jade-line);border-radius:11px;padding:12px;font-weight:700;font-size:15px;color:var(--jade-ink);margin:11px 0}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.abc{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel);cursor:pointer}
.abc:hover{border-color:var(--jade-line);background:var(--jade-soft)}
.abc .L{font-family:var(--f-en);font-size:24px;font-weight:800}
.abc .l{font-family:var(--f-en);color:var(--ink3)}
.abc .w{font-family:var(--f-en);font-size:10px;color:var(--jade-ink);font-weight:600;direction:ltr}
.tutorbtn{position:fixed;bottom:22px;right:22px;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;z-index:90;box-shadow:0 6px 18px -8px rgba(34,50,43,.5)}
#tutor{position:fixed;bottom:86px;right:22px;width:360px;max-width:calc(100vw - 30px);height:500px;max-height:68vh;background:var(--panel);border:1px solid var(--line);border-radius:18px;z-index:95;display:none;flex-direction:column;overflow:hidden}
#tutor.show{display:flex;animation:pp .25s}
.tmsg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;margin-bottom:7px}
.tmsg.me{background:var(--jade);color:#fff;align-self:flex-end;margin-inline-start:auto}
[data-theme=dark] .tmsg.me{color:#0C211A}
.tmsg.ai{background:var(--panel2);border:1px solid var(--line)}
#searchov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,25,20,.55);z-index:210;display:none;justify-content:center;padding:60px 14px 14px}
#searchov.show{display:flex}
#searchov .inner{background:var(--panel);border-radius:18px;width:100%;max-width:540px;height:max-content;max-height:66vh;overflow-y:auto;padding:13px}
.sres{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;width:100%;text-align:start}
.sres:hover{background:var(--panel2)}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100%}
.auth .art{background:var(--ink);color:var(--bg);padding:40px;display:flex;flex-direction:column;justify-content:center}
.auth .art h2{font-size:28px;font-weight:800;margin:20px 0 10px}
.auth form{padding:36px 34px;overflow-y:auto;display:flex;flex-direction:column;justify-content:center}
.bigword{font-family:var(--f-en);font-size:42px;font-weight:800;direction:ltr}
.wod{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
@media(max-width:800px){.auth{grid-template-columns:1fr}.auth .art{display:none}.auth form{padding:20px 16px}.wod{grid-template-columns:1fr}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:11px;font-weight:700;background:var(--panel);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{padding:8px 16px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--jade-soft);color:var(--jade-ink)}
.recwave{display:flex;gap:4px;align-items:center;height:36px}
.recwave i{width:4px;border-radius:3px;background:var(--red);animation:wv 1s infinite}
@keyframes wv{0%,100%{height:8px}50%{height:30px}}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border-bottom:0}
