<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لِسان · LISAN — تعلّم الإنجليزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA; --panel:#FFFFFF; --panel2:#FAF8F1; --panel3:#EFECE2;
  --ink:#22322B; --ink2:#5A6A61; --ink3:#96A296;
  --line:rgba(34,50,43,.13); --line2:rgba(34,50,43,.07);
  --jade:#0E7A5C; --jade-ink:#0A5B44; --jade-soft:#E2EFE8; --jade-line:#BED8CB;
  --amber:#C98A18; --amber-soft:#F7EDD6; --red:#C04A38; --red-soft:#F8E7E2; --red-line:#E4C3BB;
  --r:14px; --r2:10px;
  --sh:0 1px 2px rgba(34,50,43,.05), 0 10px 28px -16px rgba(34,50,43,.22);
  --sh2:0 4px 14px -6px rgba(34,50,43,.25);
  --f-ui:'IBM Plex Sans Arabic',system-ui,sans-serif; --f-en:'Sora',sans-serif;
}
[data-theme="dark"]{
  --bg:#0F1713; --panel:#18231D; --panel2:#1C2A22; --panel3:#24332B;
  --ink:#E9EFE8; --ink2:#A8B5AA; --ink3:#727F74;
  --line:rgba(233,239,232,.14); --line2:rgba(233,239,232,.07);
  --jade:#43BE92; --jade-ink:#8BDDBD; --jade-soft:rgba(67,190,146,.13); --jade-line:rgba(67,190,146,.35);
  --amber:#E2A63D; --amber-soft:rgba(226,166,61,.14); --red:#E07158; --red-soft:rgba(224,113,88,.13); --red-line:rgba(224,113,88,.35);
  --sh:0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.6);
  --sh2:0 6px 18px -8px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.en{font-family:var(--f-en);direction:ltr;display:inline-block}
.num{font-family:var(--f-en);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes lispin{to{transform:rotate(360deg)}}
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:64px 1fr;height:100vh}
#sidebar{grid-row:1/3;display:flex;flex-direction:column;border-inline-end:1px solid var(--line);background:var(--panel);padding:0 14px 14px;overflow:hidden}
#brandrow{height:64px;display:flex;align-items:center;gap:10px;padding-inline-start:6px;flex:none}
.logomark{width:34px;height:34px;border-radius:9px;background:var(--jade);display:grid;place-items:center;flex:none}
.brandname{font-weight:700;font-size:17px;letter-spacing:.3px}
.brandname small{display:block;font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:1.5px}
#nav{margin-top:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r2);color:var(--ink2);font-weight:500;position:relative;transition:background .15s,color .15s;text-align:start;width:100%}
.navitem svg{flex:none}
.navitem:hover{background:var(--panel2);color:var(--ink)}
.navitem.on{background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.navitem.on::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--jade)}
.navsec{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.8px;padding:14px 12px 5px}
#userchip{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);width:100%;margin-top:10px;flex:none}
#userchip:hover{border-color:var(--jade-line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--jade-soft);color:var(--jade-ink);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-en)}
#topbar{display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
#crumbs{min-width:0;display:flex;flex-direction:column;justify-content:center}
#crumbtitle{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumbsmall{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tspacer{flex:1}
#searchbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:250px;color:var(--ink3)}
#searchbox input{background:none;border:0;outline:0;flex:1;color:var(--ink);font-size:13.5px;min-width:0}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;background:var(--panel)}
.pill .num{font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);position:relative;flex:none}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.dot{position:absolute;top:7px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
#main{overflow-y:auto;overflow-x:hidden;padding:26px 26px 60px;position:relative}
.wrap{max-width:1060px;margin:0 auto}
#bottomnav{display:none}
@media(max-width:940px){
  #app{grid-template-columns:1fr;grid-template-rows:64px 1fr}
  #sidebar{display:none}
  #searchbox{display:none}
  #main{padding:16px 16px 92px}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);z-index:40}
  .bnitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink3);font-weight:600}
  .bnitem.on{color:var(--jade-ink)}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--jade-ink);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:10px 20px;font-weight:700;font-size:14.5px;transition:transform .12s,box-shadow .15s,background .15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--jade);color:#fff}
[data-theme="dark"] .btn.pri{color:#0C211A}
.btn.pri:hover{box-shadow:var(--sh2)}
.btn.sec{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--jade-line)}
.btn.ghost{color:var(--ink2)}.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.warn{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 26px;font-size:16px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;background:var(--panel);transition:all .15s}
.chip:hover{border-color:var(--jade-line)}
.chip.on{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--panel3);color:var(--ink2)}
.tag.j{background:var(--jade-soft);color:var(--jade-ink)}
.tag.a{background:var(--amber-soft);color:var(--amber)}
.tag.r{background:var(--red-soft);color:var(--red)}
.input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;outline:0;transition:border .15s}
.input:focus{border-color:var(--jade)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.divider{height:1px;background:var(--line2);margin:16px 0}
.progress{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress.a i{background:var(--amber)}
.abtn{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;background:var(--jade-soft);color:var(--jade-ink);flex:none;transition:background .15s}
.abtn:hover{background:var(--jade);color:#fff}
[data-theme="dark"] .abtn:hover{color:#0C211A}
.abtn.big{width:52px;height:52px;border-radius:14px}
.abtn.slow{background:var(--panel2);color:var(--ink2);width:28px;height:28px}
.headrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.headrow h1{font-size:21px;font-weight:700;flex:1;min-width:180px}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;font-size:13.5px;padding:6px 10px;border-radius:8px}
.backlink:hover{background:var(--panel2);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dash{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.dash,.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:12px}
.stat .v{font-family:var(--f-en);font-size:22px;font-weight:800;line-height:1.1}
.stat .k{font-size:12px;color:var(--ink3);font-weight:600}
.abtn.pulse{animation:pul 1.8s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(14,122,92,.35)}50%{box-shadow:0 0 0 9px rgba(14,122,92,0)}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.pop{animation:pop .3s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.node{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:var(--r2);width:100%;text-align:start;transition:background .15s}
.node:hover{background:var(--panel2)}
.node .nd{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink2)}
.node.done .nd{background:var(--jade);border-color:var(--jade);color:#fff}
[data-theme="dark"] .node.done .nd{color:#0C211A}
.node.cur .nd{border-color:var(--jade);color:var(--jade-ink);background:var(--jade-soft)}
.node.lock{opacity:.45}
.node .nt{flex:1;min-width:0}.node .nt b{display:block;font-size:14px}
.node .nt small{color:var(--ink3);font-size:12px}
.unithead{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-weight:700;color:var(--ink2)}
.unitline{height:2px;flex:1;background:var(--line)}
.lvlbadge{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-family:var(--f-en);font-weight:800;font-size:17px;flex:none;border:2px solid var(--jade-line);background:var(--jade-soft);color:var(--jade-ink)}
.lvlbadge.lock{border-color:var(--line);background:var(--panel2);color:var(--ink3)}
#player{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column}
#player .phead{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
#psegs{flex:1;display:flex;gap:4px;max-width:520px}
#psegs i{flex:1;height:6px;border-radius:6px;background:var(--panel3)}
#psegs i.d{background:var(--jade)}
#psegs i.x{background:var(--red)}
#pbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:30px 18px 40px}
.pcard{width:100%;max-width:660px}
.qtext{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.55}
.qsub{color:var(--ink2);font-size:14px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border:1.5px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--panel);font-size:16px;transition:all .15s}
.opt:hover{border-color:var(--jade-line)}
.opt .ob{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-en);font-size:12px;font-weight:700;flex:none;color:var(--ink3)}
.opt.sel{border-color:var(--jade);background:var(--jade-soft)}
.opt.ok{border-color:var(--jade);background:var(--jade-soft)}
.opt.ok .ob{background:var(--jade);color:#fff;border-color:var(--jade)}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt.no .ob{background:var(--red);color:#fff;border-color:var(--red)}
.wordinput{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:13px;padding:15px 18px;font-size:17px;outline:0;font-family:var(--f-en);direction:ltr;text-align:center}
.wordinput:focus{border-color:var(--jade)}
.chipline{min-height:58px;border:1.5px dashed var(--line);border-radius:13px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.wchip{padding:7px 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-en);font-size:15px;cursor:pointer;transition:all .12s}
.wchip:hover{border-color:var(--jade-line)}
.srcchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fb{border-radius:13px;padding:15px 18px;margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:var(--jade-soft);border:1px solid var(--jade-line)}
.fb.no{background:var(--red-soft);border:1px solid var(--red-line)}
.fb b{display:block;font-size:14.5px}
.fb small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.matchcol{display:flex;flex-direction:column;gap:8px;flex:1}
.mitem{padding:12px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);font-size:15px;transition:all .15s;min-height:46px}
.mitem.sel{border-color:var(--jade);background:var(--jade-soft)}
.mitem.lock{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade-ink);pointer-events:none}
.mitem.bad{border-color:var(--red);background:var(--red-soft)}
.speaker{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.dline{display:flex;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;background:var(--panel);align-items:flex-start}
.dline.hl{border-color:var(--jade);background:var(--jade-soft)}
.spk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;font-family:var(--f-en)}
.spk.s0{background:var(--jade-soft);color:var(--jade-ink)}
.spk.s1{background:var(--amber-soft);color:var(--amber)}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#sheetback{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:200;display:none}
#sheetback.show{display:block}
#sheet{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheetback.show + #sheet{transform:translateY(0)}
#notifpanel{position:absolute;top:56px;inset-inline-end:0;width:330px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:8px;display:none;z-index:60;max-height:60vh;overflow-y:auto}
#notifpanel.show{display:block}
.notifrow{display:flex;gap:11px;padding:11px;border-radius:10px;align-items:flex-start;width:100%;text-align:start}
.notifrow:hover{background:var(--panel2)}
.notifrow .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.flame{color:var(--amber)}
.xpflash{position:fixed;top:80px;right:40px;font-family:var(--f-en);font-weight:800;color:var(--amber);font-size:20px;z-index:150;pointer-events:none;animation:xpf 1.2s forwards}
@keyframes xpf{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:7px 16px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.tab.on{background:var(--panel);color:var(--jade-ink);box-shadow:var(--sh)}
.vocabrow{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .15s}
.vocabrow:hover{background:var(--panel2)}
.vocabrow:last-child{border-bottom:0}
.vw{font-family:var(--f-en);font-weight:700;font-size:16.5px;min-width:110px;direction:ltr}
.vocabopen{background:var(--panel2);border-bottom:1px solid var(--line2);padding:14px 18px}
.mission{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.mission:last-child{border-bottom:0}
.barchart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol .b{width:100%;max-width:34px;background:var(--jade-soft);border:1px solid var(--jade-line);border-radius:7px 7px 3px 3px;transition:height .5s}
.bcol.today .b{background:var(--jade)}
.bcol .bl{font-size:10.5px;color:var(--ink3);font-weight:600}
.bcol .bv{font-size:10px;color:var(--ink2);font-family:var(--f-en)}
.achrow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px}
.ach{flex:none;width:96px;text-align:center}
.ach .am{width:56px;height:56px;margin:0 auto 7px;border-radius:16px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber)}
.ach.lock{opacity:.4;filter:grayscale(.7)}
.ach b{font-size:11.5px;display:block;font-weight:600;line-height:1.4}
.gitem{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);width:100%;text-align:start;transition:background .15s}
.gitem:hover{background:var(--panel2)}
.gitem:last-child{border-bottom:0}
.exrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel2)}
.exrow .en{font-weight:600}
.exrow .ar{color:var(--ink2);font-size:13px;flex:1}
.mistrow{padding:12px 14px;border:1px solid var(--red-line);background:var(--red-soft);border-radius:11px;margin-bottom:8px}
.mistrow .w{color:var(--red);text-decoration:line-through;font-weight:600}
.mistrow .r{color:var(--jade-ink);font-weight:700}
.formula{font-family:var(--f-en);direction:ltr;text-align:center;background:var(--panel2);border:1px dashed var(--jade-line);border-radius:11px;padding:13px;font-weight:700;font-size:16px;color:var(--jade-ink);margin:12px 0}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.abc{border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;background:var(--panel);cursor:pointer;transition:all .15s}

.abc .L{font-family:var(--f-en);font-size:26px;font-weight:800;line-height:1.1}

.abc .w{font-family:var(--f-en);font-size:11px;color:var(--jade-ink);font-weight:600;direction:ltr}

.tutorbtn:hover{transform:scale(1.07)}

.tmsg{max-width:85%;padding:11px 14px;border-radius:14px;font-size:13.5px;margin-bottom:8px;line-height:1.55}
.tmsg.me{background:var(--jade);color:#fff;align-self:flex-end;border-end-end-radius:4px;margin-inline-start:auto}
[data-theme="dark"] .tmsg.me{color:#0C211A}
.tmsg.ai{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}

#searchov.show{display:flex}
#searchov .inner{background:var(--panel);border-radius:18px;width:100%;max-width:560px;height:max-content;max-height:70vh;overflow-y:auto;padding:14px;box-shadow:var(--sh2);animation:pop .2s}
.sres{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.sres:hover{background:var(--panel2)}

.auth .art h2{font-size:30px;font-weight:800;line-height:1.4;margin:24px 0 12px}
.auth .art p{color:rgba(233,239,232,.72);font-size:15px;max-width:40ch}
.auth .feat{display:flex;gap:12px;align-items:center;margin-top:18px;color:rgba(233,239,232,.9)}

.auth form{padding:44px 40px;overflow-y:auto;display:flex;flex-direction:column;justify-content:center}
.bigword{font-family:var(--f-en);font-size:44px;font-weight:800;letter-spacing:-1px;direction:ltr}
.wod{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}

.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;width:max-content}

(function(){
 var shown=false;
 function showFatal(msg){
  shown=true;
  var bm=document.getElementById('bootmsg');
  if(bm)bm.style.display='none';
  var b=document.getElementById('fatalbox'),m=document.getElementById('fatalmsg');
  if(!b||!m)return;
  m.innerHTML=msg;
  b.style.display='block';
 }
 window.__showFatal=showFatal;

  if(window.__LISAN_BOOTED)return;

  },1500);
 });
})();

var STORE={
 key:"lisan_db_v1", tkey:"lisan_token",
 load:function(){try{DB=JSON.parse(lsGet(this.key))}catch(e){DB=null}
  if(!DB||!DB.users)DB={users:[],data:{},sessions:{}};
  TOKEN=lsGet(this.tkey)},

function AUTHED(){return!!(TOKEN&&DB.sessions[TOKEN]&&DB.sessions[TOKEN].exp>Date.now())}
function cur(){if(!AUTHED())return null;var i;for(i=0;i<DB.users.length;i++){if(DB.users[i].id===DB.sessions[TOKEN].uid)return DB.users[i]}return null}
function U(){var u=cur();if(!u)return null;if(!DB.data[u.id])DB.data[u.id]=newUserData();return DB.data[u.id]}
function newUserData(){return{progress:{},vocab:{},grammarFav:[],xpLedger:[],attempts:[],streak:{cur:0,best:0,last:null,dates:[]},activity:{},missions:{date:null,list:[]},achievements:[],skill:{},mistakes:{},stats:{audioPlays:0,dialogues:0},placement:null}}
function hashPass(pw,salt){
 return new Promise(function(res){
  var input=salt+":"+pw;
  function fb(s){var h=5381,i;for(i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return"f"+h.toString(16)}
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
   crypto.subtle.digest("SHA-256",new TextEncoder().encode(input)).then(function(buf){
    var arr=new Uint8Array(buf),out="",i;
    for(i=0;i<arr.length;i++)out+=(arr[i]<16?'0':'')+arr[i].toString(16);
    res(out)}).catch(function(){res(fb(input))})
  }else res(fb(input));
 })
}

 PL={ls:ls,steps:ls.steps,i:0,correct:0,wrong:0,combo:0,maxCombo:0,redo:!!(U().progress[lid]&&U().progress[lid].done),stepOk:{}};
 resetStepState();

function renderPlayer(){
 var host=$("#playerhost");
 if(!PL){host.innerHTML="";return}

 var step=PL.steps[PL.i];
 host.innerHTML='<div id="player" role="dialog" aria-label="'+esc(PL.ls.t)+'"><div class="phead">'+
 '<button class="iconbtn" data-action="pquit" aria-label="close">'+ic("x",20)+'</button>'+

function isEnOpt(o){return/^[A-Za-z' .,!?-]+$/.test(o)&&o.length<40}
function renderStep(s){
 if(!s)return"";
 function A(inner){return'<div class="pop">'+inner+'</div>'}
 if(s.t==="info"){
  return A('<h2 class="qtext" style="font-size:22px">'+esc(s.title)+'</h2>'+s.body+
  (s.audio?'<div class="row" style="margin-top:16px">'+audioBtn(s.audio[0],"big")+' '+slowBtn(s.audio[0])+'<span class="mini">'+(isAR()?"استمع للنطق":"Listen to the audio")+'</span></div>':"")+
  '<button class="btn pri lg full" style="margin-top:22px" data-action="pnext">'+T("next")+' '+ic("left",16)+'</button>');
 }
 if(s.t==="mcq"||s.t==="listen"){
  return A('<div class="qtext">'+s.q+'</div>'+
  (s.say?'<div class="speaker">'+audioBtn(s.say,"big")+' '+slowBtn(s.say)+'</div>':"")+
  s.opts.map(function(o,i){return'<button class="opt" data-pick="'+i+'"><span class="ob">'+"ABCD"[i]+'</span><span>'+(isEnOpt(o)?'<span class="en">'+esc(o)+'</span>':esc(o))+'</span></button>'}).join("")+
  '<div id="pfb"></div>');
 }
 if(s.t==="tf"){
  return A('<div class="qtext">'+s.q+'</div><div class="grid2" style="gap:10px">'+
  '<button class="opt" style="justify-content:center" data-pick="0">'+ic("check",18)+' True</button>'+
  '<button class="opt" style="justify-content:center" data-pick="1">'+ic("x",18)+' False</button></div><div id="pfb"></div>');
 }
 if(s.t==="fill"){
  return A('<div class="qtext">'+T("fillQ")+'</div><div class="formula" style="direction:ltr;font-size:19px">'+
  esc(s.s).replace("___",'<input id="pin" style="width:110px;background:none;border:0;border-bottom:2px solid var(--jade);outline:0;text-align:center;font-family:var(--f-en);font-size:18px">')+'</div>'+
  hintBtn(s)+'<button class="btn pri full" style="margin-top:14px" data-action="pcheck">'+T("check")+'</button><div id="pfb"></div>');
 }
 if(s.t==="order"){
  if(!PL.orderWords)PL.orderWords=s.words.slice();
  if(!PL.orderSel)PL.orderSel=[];
  return A('<div class="qtext">'+T("orderQ")+'</div><div class="qsub" style="font-weight:600">'+esc(s.ar)+'</div>'+
  '<div class="chipline" style="direction:ltr">'+(PL.orderSel.map(function(o,i){return'<button class="wchip" data-unord="'+i+'">'+esc(o.w)+'</button>'}).join("")||'<span class="mini" style="margin:auto">'+(isAR()?"اضغط الكلمات بالترتيب":"Tap words in order")+'</span>')+'</div>'+
  '<div class="srcchips" style="direction:ltr">'+PL.orderWords.map(function(w,i){return(PL.orderUsed&&PL.orderUsed.indexOf(i)>=0)?"":'<button class="wchip" data-ord="'+i+'">'+esc(w)+'</button>'}).join("")+'</div>'+
  hintBtn(s)+'<button class="btn pri full" style="margin-top:14px" data-action="pcheck">'+T("check")+'</button><div id="pfb"></div>');
 }
 if(s.t==="match"){
  if(!PL.matchLeft){
   var L=s.pairs.map(function(p,i){return{i:i,v:p.en}});
   var R=s.pairs.map(function(p,i){return{i:i,v:p.ar}});
   PL.matchLeft=shuffle(L);PL.matchRight=shuffle(R);PL.matchLock=[];
  }
  return A('<div class="qtext">'+T("matchQ")+'</div><div style="display:flex;gap:10px">'+
  '<div class="matchcol">'+PL.matchLeft.map(function(m){return'<button class="mitem '+(PL.matchLock.indexOf(m.i)>=0?"lock":"")+' '+((PL.matchSel&&PL.matchSel.side==="L"&&PL.matchSel.i===m.i)?"sel":"")+'" data-ml="'+m.i+'" style="direction:ltr;text-align:start;font-family:var(--f-en)"'+(PL.matchLock.indexOf(m.i)>=0?" disabled":"")+'>'+esc(m.v)+'</button>'}).join("")+'</div>'+
  '<div class="matchcol">'+PL.matchRight.map(function(m){return'<button class="mitem '+(PL.matchLock.indexOf(m.i)>=0?"lock":"")+' '+((PL.matchSel&&PL.matchSel.side==="R"&&PL.matchSel.i===m.i)?"sel":"")+'" data-mr="'+m.i+'"'+(PL.matchLock.indexOf(m.i)>=0?" disabled":"")+'>'+esc(m.v)+'</button>'}).join("")+'</div>'+
  '</div><div id="pfb"></div>');
 }
 if(s.t==="spell"){
  return A('<div class="qtext">'+T("spellQ")+'</div><div class="qsub">'+esc(s.ar)+'</div>'+
  '<div class="speaker">'+audioBtn(s.word,"big")+' '+slowBtn(s.word)+'</div>'+
  '<input class="wordinput" id="pin" autocomplete="off" spellcheck="false">'+
  hintBtn(s)+'<button class="btn pri full" style="margin-top:14px" data-action="pcheck">'+T("check")+'</button><div id="pfb"></div>');
 }
 if(s.t==="trans"){
  return A('<div class="qtext">'+T("transQ")+'</div><div class="formula" style="border-style:solid;font-size:18px;font-family:var(--f-ui);direction:'+(isAR()?"rtl":"ltr")+'">'+esc(s.ar)+'</div>'+
  '<input class="wordinput" id="pin" autocomplete="off" spellcheck="false">'+
  hintBtn(s)+'<button class="btn pri full" style="margin-top:14px" data-action="pcheck">'+T("check")+'</button><div id="pfb"></div>');
 }
 return"";
}
function hintBtn(s){return s.hint?'<button class="btn ghost sm" data-action="phint">'+ic("sparkle",14)+' '+T("hint")+': '+esc(s.hint)+'</button>':""}
function pgrade(ok,correctHTML,why){
 if(!PL||PL.answered)return;
 PL.answered=true;PL.stepOk[PL.i]=ok;
 recordSkill(PL.steps[PL.i].tag,ok);
 if(ok){PL.correct++;PL.combo++;PL.maxCombo=Math.max(PL.maxCombo,PL.combo)}
 else{PL.wrong++;PL.combo=0}
 var fb=$("#pfb");
 if(fb)fb.innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+ic(ok?"check":"x",18)+'<div><b>'+(ok?T("correct"):(T("wrongAnswer")+(correctHTML?" — "+correctHTML:"")))+'</b>'+(why?'<small>'+esc(why)+'</small>':"")+'</div></div>';
 $$(".opt").forEach(function(o){o.disabled=true});
 if(fb){
  var nb=document.createElement("button");
  nb.className="btn pri full";nb.style.marginTop="12px";nb.textContent=T("next");
  nb.onclick=function(){PL.i++;resetStepState();if(PL.i>=PL.steps.length)finishLesson();else renderPlayer()};
  fb.appendChild(nb);nb.focus();
 }
}
function pcheckTyped(){
 if(!PL||PL.answered)return;
 var s=PL.steps[PL.i],inp=$("#pin");
 var val=norm(inp?inp.value:"");
 if(!val)return;
 var ok=false,correct="";
 if(s.t==="fill"||s.t==="trans"){ok=s.a.some(function(a){return norm(a)===val});correct='<span class="en">'+esc(s.a[0])+'</span>'}
 else if(s.t==="spell"){ok=(val===norm(s.word));correct='<span class="en">'+esc(s.word)+'</span>'}
 pgrade(ok,correct,s.why||"");
}
function pcheckOrder(){
 if(!PL||PL.answered)return;
 var s=PL.steps[PL.i];
 var val=PL.orderSel.map(function(o){return o.w}).join(" ");
 pgrade(norm(val)===norm(s.a),'<span class="en">'+esc(s.a)+'</span>',s.why||"");
}

 act().lessons++;STORE.save();
 if(!PL.redo)grantXP(10+PL.correct,"lesson:"+ls.id);else toast(T("redo0"));

 '<div class="row" style="justify-content:center;gap:6px;margin:10px 0">'+[1,2,3].map(function(i){return'<span style="color:'+(i<=stars?"var(--amber)":"var(--ink3)")+'">'+ic("star",22)+'</span>'}).join("")+'</div>'+
 '<div class="stat" style="justify-content:center;margin:16px 0"><span class="v" style="color:var(--jade-ink)">'+pct+'%</span><span class="k"><span class="num">'+PL.correct+'/'+total+'</span></span></div>'+
 '<div class="row" style="justify-content:center;gap:14px"><span class="tag a">'+ic("zap",13)+' +'+xpEarned+' XP</span><span class="tag">'+ic("flame",13)+' '+T("combo")+': '+PL.maxCombo+'</span></div>'+
 '<div class="row" style="justify-content:center;margin-top:24px"><button class="btn sec" data-action="pclose">'+(isAR()?"عودة للمسار":"Back to path")+'</button><button class="btn pri" data-action="pnextlesson">'+ic("play",16)+' '+(isAR()?"الدرس التالي":"Next lesson")+'</button></div>'+

var AS=null;

 var pool=POOLS[lid];
 if(!pool){toast(isAR()?"لا يوجد بنك أسئلة لهذا المستوى بعد.":"No question pool for this level yet.");return}
 AS={lid:lid,questions:samplePool(pool,Math.min(12,pool.length),Date.now()+Math.floor(Math.random()*9999)),i:0,correct:0,picked:null,mark:{}};
 renderAssess();
}
function renderAssess(){
 var host=$("#playerhost");
 if(!AS){host.innerHTML="";return}
 if(AS.i>=AS.questions.length){assessFinish();return}
 var q=AS.questions[AS.i];
 host.innerHTML='<div id="player"><div class="phead">'+
 '<button class="iconbtn" data-action="asquit" aria-label="close">'+ic("x",20)+'</button>'+
 '<div style="flex:1"><b style="font-size:14px">'+LEVELS[LVL_INDEX[AS.lid]].cefr+' — '+(isAR()?"التقييم النهائي":"Final assessment")+'</b><div id="psegs">'+AS.questions.map(function(x,i){return'<i class="'+(i<AS.i?(AS.mark[i]?"d":"x"):"")+'"></i>'}).join("")+'</div></div>'+
 '<span class="tag"><span class="num">'+(AS.i+1)+'/'+AS.questions.length+'</span></span></div>'+
 '<div id="pbody"><div class="pcard"><div class="pop"><div class="qtext">'+q.q+'</div>'+
 q.o.map(function(o,i){return'<button class="opt" data-apick="'+i+'"><span class="ob">'+"ABCD"[i]+'</span><span>'+(isEnOpt(o)?'<span class="en">'+esc(o)+'</span>':esc(o))+'</span></button>'}).join("")+
 '<div id="pfb"></div></div></div></div>';
 $$("[data-apick]").forEach(function(b){b.onclick=function(){
  if(AS.picked!=null)return;AS.picked=+b.dataset.apick;
  $$("[data-apick]").forEach(function(x){x.classList.remove("sel");if(+x.dataset.apick===AS.picked)x.classList.add("sel")});
  var fb=$("#pfb");
  if(fb){fb.innerHTML='<button class="btn pri full" id="asnext" style="margin-top:12px">'+(AS.i===AS.questions.length-1?T("results"):T("next"))+'</button>';
  var nb=$("#asnext");
  nb.onclick=function(){
   AS.mark[AS.i]=(AS.picked===q.a);if(AS.picked===q.a)AS.correct++;
   recordSkill(q.tag,AS.picked===q.a);
   AS.i++;AS.picked=null;renderAssess()};
  nb.focus()}
 }});
}
function assessFinish(){
 var d=U(),total=AS.questions.length,score=AS.correct,pct=Math.round(100*score/total);
 var pass=pct>=threshold();
 d.attempts.push({id:uid4(),type:"level",ref:AS.lid,score:score,total:total,pass:pass,at:Date.now()});
 STORE.save();
 if(pass)grantXP(60,"assess:"+AS.lid);
 checkAch();
 var wrongTags=[],seen={};
 AS.questions.forEach(function(q,i){if(!AS.mark[i]&&!seen[q.tag]){seen[q.tag]=true;wrongTags.push(q.tag)}});

 '<div id="pbody"><div class="pcard" style="text-align:center;padding:40px 0">'+
 '<div style="color:'+(pass?"var(--jade)":"var(--red)")+'">'+ic(pass?"trophy":"rotate",52)+'</div>'+
 '<h2 style="margin:14px 0 6px">'+(pass?T("unlockedMsg"):T("lockedMsg"))+'</h2>'+

 (pass?'<div class="card" style="text-align:start;margin:16px 0;padding:14px"><div class="row" style="gap:8px">'+ic("award",18)+'<b>'+(isAR()?"شهادة إنجاز داخلية — ":"Internal platform certificate — ")+LEVELS[LVL_INDEX[AS.lid]].cefr+'</b></div><p class="mini" style="margin-top:6px">'+T("confNotOfficial")+'</p></div>':
 '<div class="card" style="text-align:start;margin:16px 0;padding:14px"><b>'+T("revPlan")+'</b><p class="mini" style="margin:6px 0">'+T("weakTopics")+': '+wrongTags.join(", ")+'</p><div class="row">'+gTags.map(function(g){return'<button class="btn sec sm" style="margin:3px" data-nav="#/grammar/'+g.id+'" data-closep="1">'+esc(g.ar)+'</button>'}).join("")+'<button class="btn sec sm" data-nav="#/learn/'+AS.lid+'" data-closep="1">'+(isAR()?"راجع دروس المستوى":"Review level lessons")+'</button></div></div>')+
 '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn sec" data-action="pclose">'+T("viewAll")+'</button>'+
 (pass?'<button class="btn pri" data-nav="#/level/'+LEVELS[LVL_INDEX[AS.lid]+1].id+'" data-closep="1">'+(isAR()?"المستوى التالي":"Next level")+'</button>':'<button class="btn pri" data-action="asretake">'+ic("rotate",15)+' '+T("retake")+'</button>')+
 '</div></div></div></div>';

function startBattle(kind){
 var qs;
 if(kind==="grammar"){
  qs=samplePool(GRAMMAR.reduce(function(all,g){return all.concat(g.quiz)},[]),10,Date.now());
 }else{
  var pool=VOCAB.map(function(v){
   var wrongs=samplePool(VOCAB.filter(function(x){return x.id!==v.id}),2,dayHash(v.w)).map(function(x){return x.ar});
   var o=shuffle([v.ar].concat(wrongs));
   return{q:isAR()?("ما معنى <span class=\"en\">"+esc(v.w)+"</span>؟"):("What does \""+esc(v.w)+"\" mean?"),o:o,a:o.indexOf(v.ar),tag:"vocab"};
  });
  qs=samplePool(pool,10,Date.now());
 }
 BT={kind:kind,questions:qs,i:0,c:0,deadline:Date.now()+15000,timer:null};
 renderBattle();
 BT.timer=setInterval(function(){if(BT&&Date.now()>BT.deadline)battleNext(false)},500);
}
function battleNext(ok){
 if(!BT)return;
 if(ok)BT.c++;
 recordSkill(BT.questions[BT.i].tag,ok);
 BT.i++;
 if(BT.i>=10){
  clearInterval(BT.timer);
  var d=U(),u=cur(),key=BT.kind,c=BT.c;
  if(key==="grammar"){u.lastBattleDay=todayKey();d.battleBest=Math.max(d.battleBest||0,c)}
  else{u.lastSprintDay=todayKey();d.sprintBest=Math.max(d.sprintBest||0,c)}
  STORE.save();
  if(c>0)grantXP(2*c,"battle:"+key+":"+todayKey());
  BT=null;checkAch();
  $("#playerhost").innerHTML='<div id="player"><div id="pbody" style="flex:1;display:flex;align-items:center;justify-content:center"><div class="pcard" style="text-align:center">'+
  ic("zap",44)+'<h2 style="margin:12px 0"><span class="num">'+c+'/10</span></h2><p class="mini">'+T("timedNote")+'</p>'+
  '<div class="row" style="justify-content:center;margin-top:18px"><button class="btn pri" data-action="pclose">'+(isAR()?"تم":"Done")+'</button></div></div></div></div>';
 }else{BT.deadline=Date.now()+15000;renderBattle()}

var IRREG_BASE={went:"go",ate:"eat",saw:"see",came:"come",took:"take",made:"make",bought:"buy",found:"find",had:"have"};

 {re:/\b(he|she|it)\s+(go|come|eat|drink|work|play|study|live|like|want|need|know)\b/i,fix:function(m){return m.replace(/\b(go|come|eat|drink|work|play|study|live|like|want|need|know)\b/i,function(w){return w+"s"})},why:"الغائب المفرد (he/she/it) يحتاج s على الفعل في المضارع البسيط."},

 {re:/\b(informations|advices|knowledges|furnitures|luggages)\b/i,fix:function(m){return m.replace(/s\b/,"")},why:"هذا اسم غير معدود — لا يُجمع."},
 {re:/\bdid\s+(you|he|she|they|we|i|it)\s+(went|ate|saw|came|took|made|bought|found|had)\b/i,fix:function(m){return m.replace(/\b(went|ate|saw|came|took|made|bought|found|had)\b/i,function(w){return IRREG_BASE[w.toLowerCase()]||w})},why:"بعد did يعود الفعل مجردًا: Did you go?"},

function tutorReply(msg){

  }

 }

 for(i2=0;i2<GRAMMAR.length;i2++){var x=GRAMMAR[i2];if(m.indexOf(x.ar.split(" ")[0].slice(0,4))>=0||m.toLowerCase().indexOf(x.en.toLowerCase().split(" ")[0])>=0){g=x;break}}

 (ONB.step<3?'<div class="row" style="margin-top:24px;justify-content:space-between"><button class="btn ghost" '+(ONB.step===0?"disabled":"")+' data-action="onbback">'+(isAR()?"السابق":"Back")+'</button><button class="btn pri" data-action="onbnext">'+T("next")+'</button></div>':"")+
 '</div></div>';
}
function onbFinish(){
 var u=cur();
 u.prefs=Object.assign(u.prefs,{goalType:ONB.goalType,goal:ONB.goal,accent:ONB.accent});
 u.onboard=true;STORE.save();
 location.hash="#/dashboard";render();
}

function parseRoute(){
 var parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
 return{name:parts[0]||"dashboard",p1:parts[1]||""};
}
function render(){
 STORE.load();
 var r=parseRoute(),u=cur();
 if(!u){renderAuth();return}
 missionRefresh();
 if(!u.onboard&&r.name!=="onboard"){$("#root").innerHTML=vOnboard();$("#app").innerHTML="";return}
 if(r.name==="onboard"){$("#root").innerHTML=vOnboard();$("#app").innerHTML="";return}
 $("#root").innerHTML="";
 var title=T("home"),crumb="",html="";
 if(r.name==="dashboard"){html=vDashboard()}
 else if(r.name==="learn"){html=vLearn()}
 else if(r.name==="level"){var l=LEVELS[LVL_INDEX[r.p1]];
  if(l){html=vLevel(r.p1);title=l.cefr+" — "+l.ar;crumb=T("learn")}else{html=vLearn();title=T("learn")}}
 else if(r.name==="vocab"){if(r.p1==="review"){html=vVocabReview();title=T("reviewS")}else{html=vVocab();title=T("vocab")}}
 else if(r.name==="grammar"){if(r.p1){html=vGrammarTopic(r.p1);var g=null,i;for(i=0;i<GRAMMAR.length;i++){if(GRAMMAR[i].id===r.p1)g=GRAMMAR[i]}
  title=g?g.ar:T("grammar");crumb=T("grammar")}else{html=vGrammar();title=T("grammar")}}
 else if(r.name==="sent"){var dg=null,j;for(j=0;j<DIALOGS.length;j++){if(DIALOGS[j].id===r.p1)dg=DIALOGS[j]}
  if(dg){html=vDialogue(r.p1);title=dg.title;crumb=T("sent")}else{html=vSentences();title=T("sent")}}
 else if(r.name==="pron"){html=vPron();title=T("pron")}
 else if(r.name==="tests"){html=vTests();title=T("tests")}
 else if(r.name==="chal"){html=vChallenges();title=T("chal")}
 else if(r.name==="board"){html=vBoard();title=T("board")}
 else if(r.name==="prof"){html=vProfile();title=T("prof")}
 else if(r.name==="settings"){html=vSettings();title=T("set")}
 else html=vDashboard();
 renderShell(r.name,html,title,crumb);
 if(r.name==="grammar"&&r.p1){var b=$("#gqstart");if(b)b.onclick=function(){startGrammarQuiz(r.p1)}}
 if(r.name==="grammar"&&!r.p1){
  var q=$("#gq");
  if(q){q.value=GQ.q;q.oninput=function(){GQ.q=q.value;render();var nq=$("#gq");if(nq){nq.focus();try{nq.setSelectionRange(nq.value.length,nq.value.length)}catch(e){}}}}
 }
 if(r.name==="vocab"&&r.p1!=="review"){
  var q2=$("#vq");
  if(q2){q2.value=VQ.q;q2.oninput=function(){VQ.q=q2.value;render();var nq=$("#vq");if(nq){nq.focus();try{nq.setSelectionRange(nq.value.length,nq.value.length)}catch(e){}}}}
  var lv=$("#vlvl"),lc=$("#vcat");
  if(lv)lv.onchange=function(){VQ.lvl=lv.value;render()};
  if(lc)lc.onchange=function(){VQ.cat=lc.value;render()};
 }
 if(r.name==="vocab"&&r.p1==="review")renderSRS();
}

document.addEventListener("click",function(e){
 var t=e.target.closest("[data-action],[data-nav],[data-say],[data-pick],[data-onb],[data-ord],[data-unord],[data-ml],[data-mr],[data-reveal]");
 if(!t)return;
 if(t.dataset.nav){
  e.preventDefault();
  if(t.dataset.closep)clearAllPlayers();
  if(t.dataset.closet){var x=$("#tutor");if(x)x.remove()}
  clearAllPlayers();$("#overlayhost").innerHTML="";
  location.hash=t.dataset.nav;render();return;
 }
 if(t.dataset.say!==undefined&&t.dataset.say!==""){
  say(t.dataset.say,{rate:t.dataset.rate?+t.dataset.rate:0.92});return;
 }
 if(t.dataset.reveal){
  if(t.dataset.reveal==="1"){t.dataset.reveal="2";t.textContent=isAR()?"اضغط للاخفاء":"Tap to hide";t.style.color="var(--jade-ink)"}
  else{t.dataset.reveal="1";t.textContent=isAR()?"اضغط للكشف":"Tap to reveal";t.style.color="var(--ink3)"}
  return;
 }
 if(t.dataset.onb){ONB[t.dataset.onb]=t.dataset.v;render();return}
 if(t.dataset.pick!==undefined){
  if(!PL||PL.answered)return;
  var s=PL.steps[PL.i];
  var ansIdx=(s.t==="tf")?(s.a?0:1):s.a;
  var correctHTML=(s.t==="tf")?(s.a?"True":"False"):'<span class="en">'+esc(s.opts[s.a])+'</span>';
  pgrade(+t.dataset.pick===ansIdx,correctHTML,s.why||"");
  return;
 }
 if(t.dataset.ord!==undefined){
  if(!PL||PL.answered)return;
  PL.orderUsed=PL.orderUsed||[];PL.orderSel=PL.orderSel||[];
  PL.orderUsed.push(+t.dataset.ord);
  PL.orderSel.push({w:PL.orderWords[+t.dataset.ord],src:+t.dataset.ord});
  renderPlayer();return;
 }
 if(t.dataset.unord!==undefined){
  if(!PL||PL.answered)return;
  var item=PL.orderSel.splice(+t.dataset.unord,1)[0];
  if(item)PL.orderUsed=PL.orderUsed.filter(function(x){return x!==item.src});
  renderPlayer();return;
 }
 if(t.dataset.ml!==undefined||t.dataset.mr!==undefined){
  if(!PL||PL.answered)return;
  var side=(t.dataset.ml!==undefined)?"L":"R";
  var i2=+(t.dataset.ml!==undefined?t.dataset.ml:t.dataset.mr);
  if(PL.matchLock.indexOf(i2)>=0)return;
  if(!PL.matchSel||PL.matchSel.side===side){PL.matchSel={side:side,i:i2};renderPlayer();return}
  if(PL.matchSel.i===i2){
   PL.matchLock.push(i2);PL.matchSel=null;PL.matchDone++;
   if(PL.matchDone===PL.steps[PL.i].pairs.length){setTimeout(function(){if(PL)pgrade(PL.matchErr===0," "," ")},250)}
   else renderPlayer();
  }else{
   PL.matchErr++;t.classList.add("bad","shake");
   recordSkill(PL.steps[PL.i].tag,false);
   setTimeout(function(){PL.matchSel=null;renderPlayer()},500);
  }
  return;
 }
 var a=t.dataset.action;
 if(a==="theme"){var c=(document.documentElement.dataset.theme==="dark")?"light":"dark";lsSet("lisan_theme",c);document.documentElement.dataset.theme=c;render()}
 else if(a==="theme-set"){lsSet("lisan_theme",t.dataset.v);document.documentElement.dataset.theme=t.dataset.v;render()}
 else if(a==="lang-set"){UI=t.dataset.v;var u=cur();if(u){u.prefs.lang=UI;STORE.save()}render()}
 else if(a==="accent-set"){cur().prefs.accent=t.dataset.v;STORE.save();toast(T("saved"))}
 else if(a==="goal-set"){cur().prefs.goal=+t.dataset.v;var d=U();d.missions.date=null;missionRefresh();STORE.save();render()}
 else if(a==="thr-set"){cur().prefs.threshold=+t.dataset.v;STORE.save();toast(T("saved"));render()}
 else if(a==="privacy"){var p=cur().prefs;p.privacy=(p.privacy===false);STORE.save();render()}
 else if(a==="search"){openSearch()}
 else if(a==="closesearch"){if(e.target===t)closeSearch()}
 else if(a==="notif"){renderNotifs()}
 else if(a==="tutor"){toggleTutor()}
 else if(a==="tsend"){tutorSend()}
 else if(a==="lesson"){startLesson(t.dataset.id)}
 else if(a==="assess"){startAssess(t.dataset.id)}
 else if(a==="placement"){clearAllPlayers();startPlacement()}
 else if(a==="plset"){plset(t.dataset.l)}
 else if(a==="plquit"){PLM=null;$("#playerhost").innerHTML=""}
 else if(a==="asquit"){AS=null;$("#playerhost").innerHTML=""}
 else if(a==="asretake"){var lid=AS?AS.lid:currentLevelId();AS=null;$("#playerhost").innerHTML="";startAssess(lid)}
 else if(a==="pquit"){if(confirm(isAR()?"الخروج سيُلغي تقدم الدرس الحالي.":"Exit will discard this lesson's progress."))pclose()}
 else if(a==="pclose"){pclose()}
 else if(a==="pnextlesson"){pnextlesson()}
 else if(a==="pnext"){if(PL){PL.i++;resetStepState();if(PL.i>=PL.steps.length)finishLesson();else renderPlayer()}}
 else if(a==="pcheck"){if(!PL||PL.answered)return;if(PL.steps[PL.i].t==="order")pcheckOrder();else pcheckTyped()}
 else if(a==="phint"){toast(isAR()?"استخدام التلميح يقلل مكافأة هذا السؤال.":"Hints reduce this question's reward.")}
 else if(a==="vfav"){e.stopPropagation();var id=t.dataset.id,dv=U();dv.vocab[id]=dv.vocab[id]||{box:0,due:todayKey(),seen:0,wrong:0};dv.vocab[id].fav=!dv.vocab[id].fav;STORE.save();toast(dv.vocab[id].fav?T("saveF"):T("removedF"));render()}
 else if(a==="vadd"){e.stopPropagation();var d2=U();if(d2.vocab[t.dataset.id]){delete d2.vocab[t.dataset.id];toast(T("removedW"))}else{vocabAdd(t.dataset.id);toast(T("addedW"))}render()}
 else if(a==="wotd-add"){var d3=U();if(d3.vocab[t.dataset.id])delete d3.vocab[t.dataset.id];else vocabAdd(t.dataset.id);render()}
 else if(a==="vopen"){var el=$("#open-"+t.dataset.id);if(el)el.classList.toggle("hidden")}
 else if(a==="vtab"){VQ.tab=t.dataset.k;render()}
 else if(a==="vlvl"){VQ.lvl=(VQ.lvl===t.dataset.v?"":t.dataset.v);render()}
 else if(a==="glvl"){GQ.lvl=(GQ.lvl===t.dataset.v?"":t.dataset.v);render()}
 else if(a==="gfav"){var d4=U(),gid=t.dataset.id;var fi=d4.grammarFav.indexOf(gid);
  if(fi>=0)d4.grammarFav.splice(fi,1);else d4.grammarFav.push(gid);
  STORE.save();toast(d4.grammarFav.indexOf(gid)>=0?T("saveF"):T("removedF"));render()}
 else if(a==="dplay"){
  var dg2=null,k;for(k=0;k<DIALOGS.length;k++){if(DIALOGS[k].id===t.dataset.id)dg2=DIALOGS[k]}
  if(DPLAY.on){DPLAY.on=false;if(window.speechSynthesis)speechSynthesis.cancel();
   if($("#dplay"))$("#dplay").innerHTML=ic("play",16)+" "+T("playAll");
   $$(".dline").forEach(function(x){x.classList.remove("hl")})}
  else if(dg2)playDialogue(dg2)}
 else if(a==="ptab"){PTAB=t.dataset.k;render()}
 else if(a==="sayabc"){say(t.dataset.l).then(function(){setTimeout(function(){say(t.dataset.w)},200)})}
 else if(a==="discrim"){startDiscrim()}
 else if(a==="spellstart"){startSpell()}
 else if(a==="spellcheck"){checkSpell()}
 else if(a==="rec"){toggleRec()}
 else if(a==="battle"){startBattle(t.dataset.kind)}
 else if(a==="srs"){
  vocabRate(t.dataset.id,+t.dataset.r);bump("reviews");
  var d5=U();
  var reviewXPToday=d5.xpLedger.filter(function(x){return x.reason==="review"&&new Date(x.at).toDateString()===new Date().toDateString()}).reduce(function(s,x){return s+x.amount},0);
  if(reviewXPToday<15)grantXP(1,"review");
  SRS.i++;SRS.shown=false;renderSRS()}
 else if(a==="srs-show"){SRS.shown=true;renderSRS()}
 else if(a==="amode"){AUTH_MODE=t.dataset.v;renderAuth()}
 else if(a==="alogin"){doLogin()}
 else if(a==="aregister"){doRegister()}
 else if(a==="guest"){guestLogin()}
 else if(a==="google"){toast(T("googleNote"))}
 else if(a==="logout"){logout()}
 else if(a==="delacc"){
  if(confirm(T("deleteQ")+"\n"+T("delWarn"))){var u2=cur();delete DB.data[u2.id];
   DB.users=DB.users.filter(function(x){return x.id!==u2.id});
   delete DB.sessions[TOKEN];STORE.save();TOKEN=null;lsDel(STORE.tkey);
   location.hash="#/";render()}}
 else if(a==="export"){
  var u3=cur();
  var data={user:{name:u3.name,email:u3.email,createdAt:u3.createdAt,prefs:u3.prefs},progress:U()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var el2=document.createElement("a");el2.href=URL.createObjectURL(blob);el2.download="lisan-export.json";el2.click()}
 else if(a==="onbnext"){ONB.step=Math.min(3,ONB.step+1);render()}
 else if(a==="onbback"){ONB.step=Math.max(0,ONB.step-1);render()}
 else if(a==="onbdone"){onbFinish()}
 else if(a==="train-skill"){
  var kk=t.dataset.k;
  if(kk==="listen"){PTAB="sounds";location.hash="#/pron"}
  else if(kk==="spell"){PTAB="spell";location.hash="#/pron"}
  else if(kk==="grammar")location.hash="#/grammar";
  else{VQ.tab="review";location.hash="#/vocab"}
  render()}
 else if(a==="say-good"){var inp2=$(t.dataset.target);if(inp2&&inp2.value)say(inp2.value)}
 else if(a==="more"){
  var host=$("#overlayhost");
  var items=[["tests",T("tests"),"target"],["chal",T("chal"),"zap"],["board",T("board"),"trophy"],["grammar",T("grammar"),"edit"],["sent",T("sent"),"msg"],["prof",T("prof"),"chart"],["settings",T("set"),"sliders"]];
  host.innerHTML='<div id="sheetback" class="show" data-action="closesheet"></div><div id="sheet"><div style="width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px"></div>'+
  '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">'+items.map(function(i){return'<button style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;font-size:11.5px;font-weight:600;color:var(--ink2)" data-nav="#/'+i[0]+'">'+ic(i[2],21)+'<span>'+i[1]+'</span></button>'}).join("")+'</div>'+
  '<button class="btn sec full" style="margin-top:10px" data-action="logout">'+ic("logout",15)+' '+T("signout")+'</button></div>'}
 else if(a==="closesheet"){$("#overlayhost").innerHTML=""}
});
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"){$("#overlayhost").innerHTML="";var p=$("#notifpanel");if(p)p.classList.remove("show")}
 if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openSearch()}
});
window.addEventListener("hashchange",function(){if(!$("#playerhost").innerHTML)render()});
setInterval(function(){if(AUTHED()&&document.visibilityState==="visible"){var a=act();if(a){a.min=(a.min||0)+1;STORE.save()}}},60000);

(function init(){
 try{
  STORE.load();
  var u=cur();
  if(u)UI=(u.prefs&&u.prefs.lang)||UI;
  document.documentElement.dataset.theme=lsGet("lisan_theme")||"light";
  render();
  window.__LISAN_BOOTED=true;
  var bm=document.getElementById('bootmsg');
  if(bm)bm.style.display='none';
  if(!lsAvail())toast(T("noStore"));
 }catch(e){
  var bm2=document.getElementById('bootmsg');
  if(bm2)bm2.style.display='none';
  var nm=(e&&e.name)||"Error";
  var msg=(e&&e.message)||String(e);
  if(window.__showFatal)window.__showFatal(nm+": "+msg);
 }
})();
</script>
